<!DOCTYPE html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>A&M Formfabrik 3D Kalkulator Pro</title><meta name="theme-color" content="#6a35ff"><link rel="manifest" href="manifest.json"><style>body{font-family:Arial,sans-serif;background:#111;color:#fff;margin:0;padding:20px}.card{max-width:700px;margin:auto;background:#1e1e1e;padding:20px;border-radius:16px}input{width:100%;padding:12px;margin:6px 0 12px;border-radius:8px;border:none}button{width:100%;padding:12px;background:#6a35ff;color:#fff;border:none;border-radius:10px}.res{margin-top:15px;line-height:1.8}</style></head><body><div class="card"><h2>A&M Formfabrik 3D Kalkulator Pro</h2><input id="g" type="number" placeholder="Filament in g"><input id="h" type="number" step="0.1" placeholder="Druckzeit in Stunden"><input id="kg" type="number" value="20" placeholder="Filamentpreis €/kg"><input id="m" type="number" value="3" step="0.1" placeholder="Gewinnfaktor"><button onclick="calc()">Preis berechnen</button><div class="res" id="out"></div></div><script>function calc(){let g=+gEl.value,h=+hEl.value,kg=+kgEl.value,m=+mEl.value;let material=g*(kg/1000);let maschine=h*0.15;let kosten=material+maschine;let preis=kosten*m;out.innerHTML=`Material: ${material.toFixed(2)} €<br>Maschine: ${maschine.toFixed(2)} €<br>Herstellung: ${kosten.toFixed(2)} €<br><b>Verkaufspreis: ${preis.toFixed(2)} €</b>`;}const gEl=document.getElementById('g'),hEl=document.getElementById('h'),kgEl=document.getElementById('kg'),mEl=document.getElementById('m'),out=document.getElementById('out');if('serviceWorker' in navigator){navigator.serviceWorker.register('sw.js')}</script></body></html>
